name: Build ARMv7 for Termux
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    - name: Build
      run: |
        CC=arm-linux-androideabi-clang CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o 9router-go-android-armv7 ./cmd/9router-go/
    - uses: actions/upload-artifact@v4
      with:
        name: 9router-go-android-armv7
        path: 9router-go-android-armv7
