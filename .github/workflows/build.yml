name: Build ARMv7 for Termux
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    - name: Build Static Binary for ARMv7
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -extldflags=-static" -tags "osusergo,netgo" -o 9router-go-armv7 ./cmd/9router-go/
    - uses: actions/upload-artifact@v4
      with:
        name: 9router-go-armv7
        path: 9router-go-armv7
