name: Build Android ARMv7
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    - name: Show Go version
      run: go version
    - name: Show directory structure
      run: ls -la
    - name: Show cmd directory
      run: ls -la cmd/ || echo "cmd directory not found"
    - name: Build for Android
      run: |
        CGO_ENABLED=0 GOOS=android GOARCH=arm GOARM=7 go build -ldflags="-s -w -extldflags=-static" -tags "osusergo,netgo" -v -o 9router-go-android-armv7 ./cmd/9router-go/
    - uses: actions/upload-artifact@v4
      with:
        name: 9router-go-android-armv7
        path: 9router-go-android-armv7
